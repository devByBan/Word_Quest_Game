<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ SURVIVAL Mode ⚔️</title>
    <link rel="stylesheet" href="Css/Endless_level.css">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="room-panel">
        <div class="pixel-header">
            <span class="room-title">⚔️ WORD QUEST</span>
            <div class="header-right">
                <div class="pixel-blood">
                    <span class="blood-pixel"></span>
                    ENDLESS MODE
                </div>
                <button class="exit-door-button" onclick="window.location.href='Main_Page.html'">🚪</button>
            </div>
        </div>

        <div class="survival-stats-panel">
            <div class="stats-title">⚔️ YOUR SURVIVAL RECORDS ⚔️</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">HIGH SCORE</div>
                    <div class="stat-number large-number" id="highScoreStat">0</div>
                    <div class="stat-sub">POINTS</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">LONGEST RUN</div>
                    <div class="stat-number" id="longestRunStat">0</div>
                    <div class="stat-sub">SECONDS</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">TOTAL DIED</div>
                    <div class="stat-number" id="totalDeathsStat">0</div>
                    <div class="stat-sub">WORDS</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <a href="Endless.html" class="btn-link">
                    <button class="pixel-btn play">▶ PLAY</button>
                </a>
            </div>
        </div>
    </div>
    <script src="Js/Local_Store.js"></script>
    <script src="Js/endless_level.js"></script>
</body>
</html>

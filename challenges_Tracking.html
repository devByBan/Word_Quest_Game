<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 DAILY CHALLENGE </title>
    <link rel="stylesheet" href="css/Challenge_Tracking.css">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="room-panel">
        <div class="pixel-header">
            <span class="room-title">🏆 WORD QUEST</span>
            <div class="header-right">
                <div class="pixel-challenge">
                    <span class="challenge-pixel"></span>
                    DAILY CHALLENGE
                </div>
            </div>
        </div>

        <div class="challenge-stats-panel">
            <div class="stats-title">⚔️ TODAY'S TRIAL ⚔️</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">DAY</div>
                    <div class="stat-number day-number">#0</div>
                    <div class="stat-sub">CURRENT</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">STREAK</div>
                    <div class="stat-number">0</div>
                    <div class="stat-sub">🔥 DAYS</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">BEST</div>
                    <div class="stat-number">0</div>
                    <div class="stat-sub">MAX STREAK</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <a href="Challenges.html" class="btn-link">
                    <button class="pixel-btn play">▶ PLAY</button>
                </a>
                <a href="Main_Page.html" class="btn-link">
                    <button class="pixel-btn exit">✖ EXIT</button>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

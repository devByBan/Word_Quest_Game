<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECT CHARACTER Your Character</title>
    <link rel="stylesheet" href="css/Choose_Characters.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>

    <div class="screen">
        <h1>SELECT CHARACTER</h1>

        <div class="characters">
            <div class="char-card selected" data-name="Aurum" id="charAurum">
                <div class="sprite-wrap">
                    <div class="pixel-img">
                        <div class="img-placeholder">Name</div>
                    </div>
                </div>
                <span class="char-name">Name</span>
            </div>

            <div class="char-card" data-name="Chomper" id="charChomper">
                <div class="sprite-wrap">
                    <div class="pixel-img">
                        <div class="img-placeholder">Name</div>
                    </div>
                </div>
                <span class="char-name">Name</span>
            </div>

            <div class="char-card" data-name="Silva" id="charSilva">
                <div class="sprite-wrap">
                    <div class="pixel-img">
                        <div class="img-placeholder">Name</div>
                    </div>
                </div>
                <span class="char-name">Name</span>
            </div>

            <div class="char-card" data-name="Venus" id="charVenus">
                <div class="sprite-wrap">
                    <div class="pixel-img">
                        <div class="img-placeholder">Name</div>
                    </div>
                </div>
                <span class="char-name">Name</span>
            </div>
        </div>

        <a href="Main_Page.html" id="playLink">
            <button class="play-btn" id="playBtn">PLAY &gt;&gt;&gt;</button>
        </a>
    </div>

</body>
</html>
